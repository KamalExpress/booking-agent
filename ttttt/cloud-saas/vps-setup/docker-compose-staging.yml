version: '3.8'

services:
  cloud-saas:
    image: cloud-saas:staging
    build: 
      context: ..
      dockerfile: Dockerfile
    container_name: cloud-saas-staging
    restart: always
    ports:
      # Expose port 9743 for the Cloudflare Tunnel daemon to route to for Staging
      - "127.0.0.1:9743:8000"
    environment:
      - DATABASE_URL
      - SECRET_KEY
      - REDIS_URL=redis://saas-redis-staging:6379/0
      - EVENTBUS_BACKEND=redis
      - WATCHDOG_API_KEY
      - VAPID_PUBLIC_KEY
      - VAPID_PRIVATE_KEY
      - SUPER_ADMIN_EMAIL
      - SUPER_ADMIN_PASSWORD
      - ENVIRONMENT=staging
      - BOOKING_PORTAL_URL
      - USE_MOCK_CAPTCHA
    depends_on:
      - db
      - redis
    networks:
      - saas-network-staging
    volumes:
      - saas_data_staging:/app/data

  redis:
    image: redis:7-alpine
    container_name: saas-redis-staging
    restart: always
    command: redis-server --save "" --appendonly no
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - saas-network-staging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  operator-worker:
    image: operator-worker:staging
    build: 
      context: ../../operator-agent
      dockerfile: Dockerfile
    container_name: operator-worker-staging
    restart: always
    environment:
      - SAAS_BASE_URL=http://cloud-saas-staging:8000
      - BOOKING_PORTAL_URL
      - USE_MOCK_CAPTCHA
    depends_on:
      - cloud-saas
    networks:
      - saas-network-staging
    volumes:
      - operator_data_staging:/app/data

  booker-worker:
    image: operator-worker:staging
    build: 
      context: ../../operator-agent
      dockerfile: Dockerfile
    container_name: booker-worker-staging
    restart: always
    command: python headless_booker.py
    environment:
      - SAAS_BASE_URL=http://cloud-saas-staging:8000
      - BOOKING_PORTAL_URL
      - USE_MOCK_CAPTCHA
    depends_on:
      - cloud-saas
    networks:
      - saas-network-staging
    volumes:
      - booker_data_staging:/app/data

  db:
    image: postgres:15-alpine
    container_name: cloud-saas-db-staging
    restart: always
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: vps_secure_db_pass_123
      POSTGRES_DB: booking_saas_staging
    volumes:
      - postgres_data_staging:/var/lib/postgresql/data
    networks:
      - saas-network-staging

volumes:
  postgres_data_staging:
  operator_data_staging:
  booker_data_staging:
  saas_data_staging:

networks:
  saas-network-staging:
    driver: bridge
