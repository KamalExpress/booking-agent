version: '3.8'

services:
  postgres_dev:
    image: postgres:15
    container_name: postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sam-agent-platform_default

  cloud-saas:
    image: cloud-saas:latest
    build: .
    container_name: cloud-saas
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # In production, this will point to the production PostgreSQL instance
      - DATABASE_URL=postgresql://postgres:postgres@postgres_dev:5432/booking_saas
      - SECRET_KEY=kamal_express_saas_secure_key_12345
      # VAPID keys for Web Push Notifications (You must generate real ones for production)
      - VAPID_PRIVATE_KEY=private_key.pem
      - VAPID_PUBLIC_KEY=BOJviVyqeMuXRl9-4a_iJrH67TKwCjV7N4YZs-tZ63ZBHOtqksgujIA_0yMiDaC_EAt-wUJ4YNJN4vZMoBMeuzs
    volumes:
      - ./private_key.pem:/app/private_key.pem
      - cloud_saas_data:/app/data
    networks:
      - sam-agent-platform_default

  operator-agent:
    image: operator-agent:latest
    build:
      context: ../operator-agent
      dockerfile: Dockerfile
    container_name: operator-agent
    restart: unless-stopped
    environment:
      - SAAS_BASE_URL=http://cloud-saas:8000
    depends_on:
      - cloud-saas
    networks:
      - sam-agent-platform_default
    volumes:
      - operator_data:/app/data

  booker-agent:
    image: operator-agent:latest
    build:
      context: ../operator-agent
      dockerfile: Dockerfile
    container_name: booker-agent
    restart: unless-stopped
    command: python headless_booker.py
    environment:
      - SAAS_BASE_URL=http://cloud-saas:8000
    depends_on:
      - cloud-saas
    networks:
      - sam-agent-platform_default
    volumes:
      - booker_data:/app/data

networks:
  sam-agent-platform_default:
    driver: bridge

volumes:
  postgres_data:
  cloud_saas_data:
  operator_data:
  booker_data:
