version: '3.8'

services:
  postgres_staging:
    image: postgres:15
    container_name: postgres_staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: vps_secure_db_pass_123
      POSTGRES_DB: booking_saas_staging
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - sam-agent-platform_staging

  cloud-saas-staging:
    image: cloud-saas:staging
    build: .
    container_name: cloud-saas-staging
    restart: unless-stopped
    ports:
      - "9743:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://redis_staging:6379/0
      - EVENTBUS_BACKEND=redis
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
    volumes:
      - ./private_key.pem:/app/private_key.pem
      - cloud_saas_data:/app/data
    depends_on:
      - postgres_staging
      - redis_staging
    networks:
      - sam-agent-platform_staging

  redis_staging:
    image: redis:7-alpine
    container_name: redis_staging
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "6380:6379"
    networks:
      - sam-agent-platform_staging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  operator-agent-staging:
    image: operator-agent:staging
    build:
      context: ../operator-agent
      dockerfile: Dockerfile
    container_name: operator-agent-staging
    restart: unless-stopped
    environment:
      - SAAS_BASE_URL=http://cloud-saas-staging:8000
    depends_on:
      - cloud-saas-staging
    networks:
      - sam-agent-platform_staging
    volumes:
      - operator_data_staging:/app/data

  booker-agent-staging:
    image: operator-agent:staging
    build:
      context: ../operator-agent
      dockerfile: Dockerfile
    container_name: booker-agent-staging
    restart: unless-stopped
    command: python headless_booker.py
    environment:
      - SAAS_BASE_URL=http://cloud-saas-staging:8000
    depends_on:
      - cloud-saas-staging
    networks:
      - sam-agent-platform_staging
    volumes:
      - booker_data_staging:/app/data

networks:
  sam-agent-platform_staging:
    driver: bridge

volumes:
  postgres_staging_data:
  cloud_saas_data:
  operator_data_staging:
  booker_data_staging:
