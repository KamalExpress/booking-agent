name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/staging
      - feature/sep-2026
  pull_request:
    branches:
      - main
      - feature/staging

jobs:
  lint-and-test:
    name: Lint & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f ttttt/cloud-saas/requirements.txt ]; then pip install -r ttttt/cloud-saas/requirements.txt; fi
          if [ -f ttttt/operator-agent/requirements.txt ]; then pip install -r ttttt/operator-agent/requirements.txt; fi
          pip install flake8 pytest

      - name: Syntax & Lint Check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 ttttt/cloud-saas/app ttttt/operator-agent --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 ttttt/cloud-saas/app ttttt/operator-agent --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  build-and-deploy:
    name: Build & Deploy to VPS
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/staging'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment Target
        id: env-target
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "webhook_secret=${{ secrets.PORTAINER_PROD_WEBHOOK }}" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "webhook_secret=${{ secrets.PORTAINER_STAGING_WEBHOOK }}" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Portainer Webhook
        if: steps.env-target.outputs.webhook_secret != ''
        run: |
          echo "Triggering Portainer Webhook for ${{ steps.env-target.outputs.env_name }}..."
          curl -X POST -k "${{ steps.env-target.outputs.webhook_secret }}"
          echo "Webhook triggered successfully."
